<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>
    <p>Please complete the form below with your correct details.</p>

    <form id="student-form" action="#" method="post">
        <table border="1" cellpadding="8" cellspacing="0">
            <tbody>
                <tr>
                    <td><label for="matric-no"><strong>Matric Number:</strong></label></td>
                    <td>
                        <input type="text" id="matric-no" name="matric_no" placeholder="Enter matric number" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="student-name"><strong>Full Name:</strong></label></td>
                    <td>
                        <input type="text" id="student-name" name="student_name" placeholder="Enter full name" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="gender"><strong>Gender:</strong></label></td>
                    <td>
                        <select id="gender" name="gender" required>
                            <option value="" disabled selected>-- Select Gender --</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="department"><strong>Department:</strong></label></td>
                    <td>
                        <select id="department" name="department" required>
                            <option value="" disabled selected>-- Select Department --</option>
                            <option value="Cybersecurity and Data Sciences">Cybersecurity and Data Sciences</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Information Communication Technology">Information Communication Technology</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Software Engineering and Information System">Software Engineering and Information System</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label><strong>Program:</strong></label></td>
                    <td>
                        <label><input type="radio" name="program" value="Full-time" required> Full-time</label>&nbsp;&nbsp;
                        <label><input type="radio" name="program" value="Weekday"> Weekday</label>&nbsp;&nbsp;
                        <label><input type="radio" name="program" value="Weekend"> Weekend</label>
                    </td>
                </tr>

                <tr>
                    <td><label for="email-address"><strong>Email Address:</strong></label></td>
                    <td>
                        <input type="email" id="email-address" name="email_address" placeholder="Enter email address" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="phone-number"><strong>Phone Number:</strong></label></td>
                    <td>
                        <input type="tel" id="phone-number" name="phone_number" placeholder="Enter phone number" required>
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" id="submit-btn" value="Submit Registration">
                        &nbsp;&nbsp;
                        <input type="reset" id="reset-btn" value="Reset Form">
                    </td>
                </tr>
            </tbody>
        </table>
    </form>

</body>
</html>
